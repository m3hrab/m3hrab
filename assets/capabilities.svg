<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="What I build: agent-native backends, harness and context engineering, multi-agent workflows, production foundations" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:Inter,"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,34px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.u{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.drift{animation:drift 14s ease-in-out infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
.flow{stroke-dasharray:4 6;animation:flow 1.4s linear infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
</style>
<defs>
<clipPath id="c"><rect width="1200" height="640" rx="20"/></clipPath>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#91B5AC"/><stop offset="1" stop-color="#CFE3DD"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#91B5AC" stop-opacity=".55"/><stop offset="1" stop-color="#91B5AC" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#91B5AC" stop-opacity=".32"/><stop offset="1" stop-color="#91B5AC" stop-opacity="0"/></radialGradient>
<radialGradient id="rg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#91B5AC" fill-opacity=".22"/></pattern>
<mask id="m"><rect width="1200" height="640" fill="url(#rg)"/></mask>

</defs>
<g clip-path="url(#c)">
<rect width="1200" height="640" fill="#090E13"/>
<rect width="1200" height="640" fill="url(#dots)" mask="url(#m)" opacity=".7"/>
<g class="u" style="animation-delay:0.1s">
<polygon points="60,62 66,68 60,74 54,68" fill="#91B5AC" transform="translate(0,0)"/>
<text x="78" y="73" class="mono" font-size="13" letter-spacing="4" fill="#91B5AC">02 — CAPABILITIES</text>
<line x1="302.6" y1="68" x2="1140" y2="68" stroke="url(#hl)"/>
<text x="56" y="152" class="serif" font-size="56" letter-spacing="-1" fill="#F0F4F4">What I build.</text></g><g class="u" style="animation-delay:0.3s"><rect x="60" y="190" width="525" height="186" rx="14" fill="#0F1A1C" stroke="#1C2E2F"/>
<line x1="84" y1="190.5" x2="260" y2="190.5" stroke="url(#hl)" stroke-width="2"/>
<text x="88" y="232" class="mono" font-size="13" letter-spacing="3" fill="#91B5AC">01</text>
<text x="88" y="270" class="serif" font-size="29" fill="#F0F4F4">Agent-native backends</text>
<text x="88" y="302" class="sans" font-size="15.5" fill="#8FA3A0">APIs, MCP servers and tool layers designed</text>
<text x="88" y="324" class="sans" font-size="15.5" fill="#8FA3A0">for agents and humans to use reliably.</text>
<text x="88" y="356" class="mono" font-size="11.5" letter-spacing="2" fill="#4F6664">PYTHON · FASTAPI · DJANGO · MCP</text></g><g class="u" style="animation-delay:0.44999999999999996s"><rect x="615" y="190" width="525" height="186" rx="14" fill="#0F1A1C" stroke="#1C2E2F"/>
<line x1="639" y1="190.5" x2="815" y2="190.5" stroke="url(#hl)" stroke-width="2"/>
<text x="643" y="232" class="mono" font-size="13" letter-spacing="3" fill="#91B5AC">02</text>
<text x="643" y="270" class="serif" font-size="29" fill="#F0F4F4">Harness &amp; context engineering</text>
<text x="643" y="302" class="sans" font-size="15.5" fill="#8FA3A0">Execution environments, constraints, memory and</text>
<text x="643" y="324" class="sans" font-size="15.5" fill="#8FA3A0">verification that keep agents on the rails.</text>
<text x="643" y="356" class="mono" font-size="11.5" letter-spacing="2" fill="#4F6664">CONTEXT · CONSTRAINTS · VERIFICATION</text></g><g class="u" style="animation-delay:0.6s"><rect x="60" y="406" width="525" height="186" rx="14" fill="#0F1A1C" stroke="#1C2E2F"/>
<line x1="84" y1="406.5" x2="260" y2="406.5" stroke="url(#hl)" stroke-width="2"/>
<text x="88" y="448" class="mono" font-size="13" letter-spacing="3" fill="#91B5AC">03</text>
<text x="88" y="486" class="serif" font-size="29" fill="#F0F4F4">Multi-agent workflows</text>
<text x="88" y="518" class="sans" font-size="15.5" fill="#8FA3A0">Orchestration, delegation and human-in-the-loop</text>
<text x="88" y="540" class="sans" font-size="15.5" fill="#8FA3A0">flows that turn many agents into one system.</text>
<text x="88" y="572" class="mono" font-size="11.5" letter-spacing="2" fill="#4F6664">CLAUDE CODE · CURSOR · CODEX</text></g><g class="u" style="animation-delay:0.75s"><rect x="615" y="406" width="525" height="186" rx="14" fill="#0F1A1C" stroke="#1C2E2F"/>
<line x1="639" y1="406.5" x2="815" y2="406.5" stroke="url(#hl)" stroke-width="2"/>
<text x="643" y="448" class="mono" font-size="13" letter-spacing="3" fill="#91B5AC">04</text>
<text x="643" y="486" class="serif" font-size="29" fill="#F0F4F4">Production foundations</text>
<text x="643" y="518" class="sans" font-size="15.5" fill="#8FA3A0">Async processing, data models, containers and cloud:</text>
<text x="643" y="540" class="sans" font-size="15.5" fill="#8FA3A0">the unglamorous parts that make AI dependable.</text>
<text x="643" y="572" class="mono" font-size="11.5" letter-spacing="2" fill="#4F6664">POSTGRES · REDIS · DOCKER · AWS</text></g>
</g>
<rect x=".5" y=".5" width="1199" height="639" rx="20" fill="none" stroke="#1C2E2F"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>