<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 324" width="1200" height="324" role="img" aria-label="Reliable backends for the agentic era: Python, AI agents and MCP. Open to remote backend and AI roles." xmlns:c2pa="http://c2pa.org/manifest">
<style>
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:Inter,"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,34px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.u{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.drift{animation:drift 14s ease-in-out infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
.flow{stroke-dasharray:4 6;animation:flow 1.4s linear infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
</style>
<defs>
<clipPath id="c"><rect width="1200" height="324" rx="20"/></clipPath>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#91B5AC"/><stop offset="1" stop-color="#CFE3DD"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#91B5AC" stop-opacity=".55"/><stop offset="1" stop-color="#91B5AC" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#91B5AC" stop-opacity=".32"/><stop offset="1" stop-color="#91B5AC" stop-opacity="0"/></radialGradient>
<radialGradient id="rg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#91B5AC" fill-opacity=".22"/></pattern>
<mask id="m"><rect width="1200" height="324" fill="url(#rg)"/></mask>

</defs>
<g clip-path="url(#c)">
<rect width="1200" height="324" fill="#090E13"/>
<rect width="1200" height="324" fill="url(#dots)" mask="url(#m)" opacity=".7"/>
<g class="drift"><ellipse cx="900" cy="140" rx="440" ry="220" fill="url(#glow)"/></g>
<g class="u" style="animation-delay:0.1s"><polygon points="80,76 86,82 80,88 74,82" fill="#91B5AC"/>
<text x="98" y="87" class="mono" font-size="13" letter-spacing="5" fill="#91B5AC">PYTHON · AI AGENTS · MCP</text></g>
<text style="animation-delay:0.3s" x="76" y="166" font-size="60" letter-spacing="-1.5" fill="#F0F4F4" class="u serif">Reliable backends</text>
<text style="animation-delay:0.5s" x="76" y="236" font-size="60" font-style="italic" letter-spacing="-1.5" fill="url(#tg)" class="u serif">for the agentic era.</text>
<g class="u" style="animation-delay:0.7s"><ellipse cx="930" cy="150" rx="140" ry="86" fill="none" stroke="#1C2E2F" stroke-dasharray="2 8"/><line class="flow" x1="930" y1="150" x2="930.0" y2="64.0" stroke="#91B5AC" stroke-opacity=".45"/><circle cx="930" cy="150" r="3" fill="#CFE3DD"><animateMotion dur="2.4s" repeatCount="indefinite" path="M0,0 L0.0,-86.0"/></circle><circle cx="930.0" cy="64.0" r="5.5" fill="#090E13" stroke="#91B5AC" stroke-width="1.6"/><text x="930.0" y="48.0" text-anchor="middle" class="mono" font-size="12" letter-spacing="2" fill="#A0B5B1">CONTEXT</text><line class="flow" x1="930" y1="150" x2="1063.1" y2="123.4" stroke="#91B5AC" stroke-opacity=".45"/><circle cx="930" cy="150" r="3" fill="#CFE3DD"><animateMotion dur="2.9s" repeatCount="indefinite" path="M0,0 L133.1,-26.6"/></circle><circle cx="1063.1" cy="123.4" r="5.5" fill="#090E13" stroke="#91B5AC" stroke-width="1.6"/><text x="1079.1" y="127.4" text-anchor="start" class="mono" font-size="12" letter-spacing="2" fill="#A0B5B1">TOOLS · MCP</text><line class="flow" x1="930" y1="150" x2="1012.3" y2="219.6" stroke="#91B5AC" stroke-opacity=".45"/><circle cx="930" cy="150" r="3" fill="#CFE3DD"><animateMotion dur="3.4s" repeatCount="indefinite" path="M0,0 L82.3,69.6"/></circle><circle cx="1012.3" cy="219.6" r="5.5" fill="#090E13" stroke="#91B5AC" stroke-width="1.6"/><text x="1028.3" y="223.6" text-anchor="start" class="mono" font-size="12" letter-spacing="2" fill="#A0B5B1">VERIFY</text><line class="flow" x1="930" y1="150" x2="847.7" y2="219.6" stroke="#91B5AC" stroke-opacity=".45"/><circle cx="930" cy="150" r="3" fill="#CFE3DD"><animateMotion dur="3.9s" repeatCount="indefinite" path="M0,0 L-82.3,69.6"/></circle><circle cx="847.7" cy="219.6" r="5.5" fill="#090E13" stroke="#91B5AC" stroke-width="1.6"/><text x="831.7" y="223.6" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#A0B5B1">MEMORY</text><line class="flow" x1="930" y1="150" x2="796.9" y2="123.4" stroke="#91B5AC" stroke-opacity=".45"/><circle cx="930" cy="150" r="3" fill="#CFE3DD"><animateMotion dur="4.4s" repeatCount="indefinite" path="M0,0 L-133.1,-26.6"/></circle><circle cx="796.9" cy="123.4" r="5.5" fill="#090E13" stroke="#91B5AC" stroke-width="1.6"/><text x="780.9" y="127.4" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#A0B5B1">HUMAN</text><circle class="ring" cx="930" cy="150" r="20" fill="none" stroke="#91B5AC"/><circle cx="930" cy="150" r="20" fill="#0F1A1C" stroke="#91B5AC" stroke-width="1.6"/><circle cx="930" cy="150" r="6" fill="#91B5AC"/><text x="930" y="194" text-anchor="middle" class="mono" font-size="11" letter-spacing="4" fill="#91B5AC">AGENT</text></g>
<line x1="80" y1="266" x2="1120" y2="266" stroke="url(#hl)"/>
<g class="u" style="animation-delay:1.4s"><circle class="pulse" cx="86" cy="294" r="4.5" fill="#91B5AC"/>
<text x="104" y="299" class="mono" font-size="12" letter-spacing="3" fill="#A0B5B1">OPEN TO REMOTE BACKEND &amp; AI ROLES</text></g>
</g>
<rect x=".5" y=".5" width="1199" height="323" rx="20" fill="none" stroke="#1C2E2F"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>