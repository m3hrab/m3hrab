<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="The agent loop: intent, context, plan, act, verify, ship, with a feedback loop from verify back to context" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:Inter,"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,34px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.u{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.drift{animation:drift 14s ease-in-out infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
.flow{stroke-dasharray:4 6;animation:flow 1.4s linear infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
</style>
<defs>
<clipPath id="c"><rect width="1200" height="510" rx="20"/></clipPath>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#91B5AC"/><stop offset="1" stop-color="#CFE3DD"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#91B5AC" stop-opacity=".55"/><stop offset="1" stop-color="#91B5AC" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#91B5AC" stop-opacity=".32"/><stop offset="1" stop-color="#91B5AC" stop-opacity="0"/></radialGradient>
<radialGradient id="rg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#91B5AC" fill-opacity=".22"/></pattern>
<mask id="m"><rect width="1200" height="510" fill="url(#rg)"/></mask>

</defs>
<g clip-path="url(#c)">
<rect width="1200" height="510" fill="#090E13"/>
<rect width="1200" height="510" fill="url(#dots)" mask="url(#m)" opacity=".7"/>
<g class="u" style="animation-delay:0.1s">
<polygon points="60,62 66,68 60,74 54,68" fill="#91B5AC" transform="translate(0,0)"/>
<text x="78" y="73" class="mono" font-size="13" letter-spacing="4" fill="#91B5AC">01 — THE LOOP</text>
<line x1="255.4" y1="68" x2="1140" y2="68" stroke="url(#hl)"/>
<text x="56" y="152" class="serif" font-size="56" letter-spacing="-1" fill="#F0F4F4">How agents reach production.</text></g><line x1="110" y1="250" x2="1090" y2="250" stroke="#1C2E2F" stroke-width="2"/><line x1="110" y1="250" x2="1090" y2="250" stroke="url(#hl)" stroke-width="2"/><g class="u" style="animation-delay:0.3s"><text x="110" y="212" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#91B5AC">01</text>
<circle cx="110" cy="250" r="11" fill="#090E13" stroke="#91B5AC" stroke-width="2"/><circle cx="110" cy="250" r="3.5" fill="#91B5AC"/>
<text x="110" y="294" text-anchor="middle" class="serif" font-size="25" fill="#F0F4F4">Human intent</text>
<text x="110" y="318" text-anchor="middle" class="mono" font-size="11.5" fill="#8FA3A0">goals &amp; constraints</text></g><g class="u" style="animation-delay:0.44s"><text x="306" y="212" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#91B5AC">02</text>
<circle cx="306" cy="250" r="11" fill="#090E13" stroke="#91B5AC" stroke-width="2"/><circle cx="306" cy="250" r="3.5" fill="#91B5AC"/>
<text x="306" y="294" text-anchor="middle" class="serif" font-size="25" fill="#F0F4F4">Context</text>
<text x="306" y="318" text-anchor="middle" class="mono" font-size="11.5" fill="#8FA3A0">structured &amp; scoped</text></g><g class="u" style="animation-delay:0.5800000000000001s"><text x="502" y="212" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#91B5AC">03</text>
<circle cx="502" cy="250" r="11" fill="#090E13" stroke="#91B5AC" stroke-width="2"/><circle cx="502" cy="250" r="3.5" fill="#91B5AC"/>
<text x="502" y="294" text-anchor="middle" class="serif" font-size="25" fill="#F0F4F4">Plan</text>
<text x="502" y="318" text-anchor="middle" class="mono" font-size="11.5" fill="#8FA3A0">decompose &amp; delegate</text></g><g class="u" style="animation-delay:0.72s"><text x="698" y="212" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#91B5AC">04</text>
<circle cx="698" cy="250" r="11" fill="#090E13" stroke="#91B5AC" stroke-width="2"/><circle cx="698" cy="250" r="3.5" fill="#91B5AC"/>
<text x="698" y="294" text-anchor="middle" class="serif" font-size="25" fill="#F0F4F4">Act</text>
<text x="698" y="318" text-anchor="middle" class="mono" font-size="11.5" fill="#8FA3A0">tools via MCP</text></g><g class="u" style="animation-delay:0.8600000000000001s"><text x="894" y="212" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#91B5AC">05</text>
<circle cx="894" cy="250" r="11" fill="#090E13" stroke="#91B5AC" stroke-width="2"/><circle cx="894" cy="250" r="3.5" fill="#91B5AC"/>
<text x="894" y="294" text-anchor="middle" class="serif" font-size="25" fill="#F0F4F4">Verify</text>
<text x="894" y="318" text-anchor="middle" class="mono" font-size="11.5" fill="#8FA3A0">tests, checks, review</text></g><g class="u" style="animation-delay:1.0s"><text x="1090" y="212" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#91B5AC">06</text>
<circle cx="1090" cy="250" r="11" fill="#090E13" stroke="#91B5AC" stroke-width="2"/><circle cx="1090" cy="250" r="3.5" fill="#91B5AC"/>
<text x="1090" y="294" text-anchor="middle" class="serif" font-size="25" fill="#F0F4F4">Ship</text>
<text x="1090" y="318" text-anchor="middle" class="mono" font-size="11.5" fill="#8FA3A0">human signs off</text></g><path class="flow" d="M894,338 C894,404 306,404 306,338" fill="none" stroke="#91B5AC" stroke-opacity=".6"/>
<polygon points="300,346 312,346 306,332" fill="#91B5AC"/>
<text x="600" y="414" text-anchor="middle" class="mono" font-size="11" letter-spacing="4" fill="#4F6664">VERIFY → CONTEXT · THE LOOP THAT BUILDS TRUST</text>
<circle cx="110" cy="250" r="4.5" fill="#CFE3DD"><animateMotion dur="7s" repeatCount="indefinite" path="M0,0 H980"/></circle>
<circle cx="894" cy="338" r="4" fill="#CFE3DD"><animateMotion dur="5s" repeatCount="indefinite" path="M0,0 C0,66 -588,66 -588,0"/></circle>
<line x1="60" y1="446" x2="1140" y2="446" stroke="#1C2E2F"/>
<text x="600" y="478" text-anchor="middle" class="mono" font-size="12" letter-spacing="5" fill="#91B5AC">HUMAN JUDGMENT · AGENTIC EXECUTION · ENGINEERING DISCIPLINE</text>
</g>
<rect x=".5" y=".5" width="1199" height="509" rx="20" fill="none" stroke="#1C2E2F"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>