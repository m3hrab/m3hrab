<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 478" width="1200" height="478" role="img" aria-label="Terminal card: whoami, thesis and current status" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:Inter,"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,34px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.u{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.drift{animation:drift 14s ease-in-out infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
.flow{stroke-dasharray:4 6;animation:flow 1.4s linear infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
</style>
<defs>
<clipPath id="c"><rect width="1200" height="478" rx="20"/></clipPath>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#91B5AC"/><stop offset="1" stop-color="#CFE3DD"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#91B5AC" stop-opacity=".55"/><stop offset="1" stop-color="#91B5AC" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#91B5AC" stop-opacity=".32"/><stop offset="1" stop-color="#91B5AC" stop-opacity="0"/></radialGradient>
<radialGradient id="rg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#91B5AC" fill-opacity=".22"/></pattern>
<mask id="m"><rect width="1200" height="478" fill="url(#rg)"/></mask>

</defs>
<g clip-path="url(#c)">
<rect width="1200" height="478" fill="#090E13"/>
<rect width="1200" height="478" fill="url(#dots)" mask="url(#m)" opacity=".7"/>
<rect width="1200" height="52" fill="#0F1A1C"/><line x1="0" y1="52" x2="1200" y2="52" stroke="#1C2E2F"/>
<circle cx="34" cy="26" r="6" fill="#243A3B"/><circle cx="56" cy="26" r="6" fill="#35504F"/><circle cx="78" cy="26" r="6" fill="#91B5AC"/>
<text x="600" y="31" text-anchor="middle" class="mono" font-size="13" letter-spacing="1" fill="#4F6664">mehrab@m3hrab — ~/profile</text><g class="u" style="animation-delay:0.4s"><text x="44" y="116" class="mono" font-size="18" fill="#91B5AC">$</text><text x="70" y="116" class="mono" font-size="18" fill="#F0F4F4">whoami</text></g><text style="animation-delay:0.9s" x="70" y="150" font-size="18" fill="#A9BDBA" class="u mono">Mehrab Hossain — backend &amp; agentic systems engineer</text><g class="u" style="animation-delay:1.4s"><text x="44" y="198" class="mono" font-size="18" fill="#91B5AC">$</text><text x="70" y="198" class="mono" font-size="18" fill="#F0F4F4">cat thesis.md</text></g><text style="animation-delay:1.9s" x="70" y="232" font-size="18" fill="#A9BDBA" class="u mono">→  agents are only as good as their harness</text><text style="animation-delay:2.4s" x="70" y="266" font-size="18" fill="#A9BDBA" class="u mono">→  context, constraints and verification beat clever prompts</text><text style="animation-delay:2.9s" x="70" y="300" font-size="18" fill="#A9BDBA" class="u mono">→  human judgment on top, agentic execution underneath</text><g class="u" style="animation-delay:3.4s"><text x="44" y="348" class="mono" font-size="18" fill="#91B5AC">$</text><text x="70" y="348" class="mono" font-size="18" fill="#F0F4F4">./status --now</text></g><g class="u" style="animation-delay:3.9s"><circle class="pulse" cx="76" cy="376" r="5" fill="#91B5AC"/><text x="96" y="382" class="mono" font-size="18" fill="#F0F4F4">open to remote backend &amp; AI-engineering roles</text></g><g class="u" style="animation-delay:4.4s"><text x="44" y="430" class="mono" font-size="18" fill="#91B5AC">$</text><rect class="blink" x="70" y="414" width="10" height="20" fill="#91B5AC"/></g>
</g>
<rect x=".5" y=".5" width="1199" height="477" rx="20" fill="none" stroke="#1C2E2F"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>